name: V1-02 Claim Comparison Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v1-02-verify.yml"
      - "Makefile"
      - "docker-compose.yml"
      - ".env.example"
      - "apps/api/**"
      - "infra/postgres/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/v1-02-verify.yml"
      - "Makefile"
      - "docker-compose.yml"
      - ".env.example"
      - "apps/api/**"
      - "infra/postgres/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-02-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-v1-02:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run V1-02 closure gates
        run: make verify-v1-02

      - name: Capture Compose state on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs postgres || true

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true
