name: D4 MASTER Reconcile Once

on:
  push:
    branches:
      - d4-description-aware-evidence
    paths:
      - .github/workflows/d4-master-reconcile-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile authoritative progression header without rewriting ledger
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='**Post-v1 progression state:** **ENABLED — D3 selected / D3-01 active**'
          replacement='**Post-v1 progression state:** **ENABLED — D4 selected/current / D4-01 active**'
          count="$(grep -Fxc "$expected" CLAIMTRACE_V1_MASTER.md)"
          test "$count" = "1"
          python - <<'PY'
          from pathlib import Path
          path = Path('CLAIMTRACE_V1_MASTER.md')
          text = path.read_text()
          old = '**Post-v1 progression state:** **ENABLED — D3 selected / D3-01 active**'
          new = '**Post-v1 progression state:** **ENABLED — D4 selected/current / D4-01 active**'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- CLAIMTRACE_V1_MASTER.md
      - name: Create preservation-safe reconciliation commit on temporary ref
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'claimtrace-progression-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/d4-master-reconcile-once.yml
          git add CLAIMTRACE_V1_MASTER.md
          git diff --cached --check
          git commit -m 'docs: reconcile D4 progression authority'
          git push origin HEAD:refs/heads/d4-master-reconciled-temp --force
