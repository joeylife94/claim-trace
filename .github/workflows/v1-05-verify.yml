name: V1-05 Human Review Verification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/v1-05-verify.yml"
      - ".env.example"
      - "docker-compose.yml"
      - "apps/api/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-05-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure repository environment
        run: make init

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API image
        run: docker compose build api

      - name: Start PostgreSQL
        run: |
          docker compose up -d postgres
          for attempt in {1..20}; do
            if docker compose exec -T postgres sh -ec 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Run review persistence and API tests
        run: |
          set +e
          output=$(docker compose run --rm api pytest --disable-warnings \
            tests/test_claim_element_reviews.py 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 0
          printf '%s\n' "$output" | grep -Eq '[0-9]+ passed'
          ! printf '%s\n' "$output" | grep -Eq '[0-9]+ skipped'

      - name: Ruff lint
        run: docker compose run --rm -e RUFF_CACHE_DIR=/tmp/ruff-cache api ruff check .

      - name: Ruff format check
        run: docker compose run --rm -e RUFF_CACHE_DIR=/tmp/ruff-cache api ruff format --check .

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true
