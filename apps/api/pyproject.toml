[project]
name = "claimtrace-api"
version = "0.1.0"
description = "ClaimTrace API - evidence-grounded patent claim analysis backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "pymupdf>=1.24",
    "python-multipart>=0.0.20",
    # pgvector's SQLAlchemy Vector type. Small pure-Python package: the ORM needs
    # it to declare the embedding column, whether or not a model is installed.
    "pgvector>=0.3.6",
    # The async HTTP client the LLM adapters are built on. Promoted from the dev
    # extra in Phase 4A-1: it is now a runtime dependency, not just the transport
    # FastAPI's TestClient happens to use. Deliberately chosen over the `openai`
    # SDK - see claimtrace_api.llm.openai_compatible for why.
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
# The real local embedding provider. Kept out of the base dependency set because
# it pulls torch: the API, its migrations, and the whole test suite run without
# it, and only claim indexing with EMBEDDING_PROVIDER=sentence-transformers
# needs it. Tests never import it.
embeddings = [
    "sentence-transformers>=3.3,<6",
    # Declared explicitly, and only so that [tool.uv.sources] below can pin it to
    # the CPU wheel index: a source override applies to direct dependencies only,
    # and as a bare transitive of sentence-transformers torch resolves to the
    # CUDA build instead.
    "torch>=2.4,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimtrace_api"]

[tool.uv]
default-groups = []

# sentence-transformers depends on torch, whose default PyPI wheel carries the
# CUDA runtime (several GB). This deployment is CPU-only and on-premise, so the
# CPU build is requested explicitly. "explicit = true" keeps every other package
# coming from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." lets test modules share helpers via `from tests.pdf_factory import ...`.
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "integration: requires a reachable PostgreSQL instance (skipped when absent)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "C4",  # comprehensions
    "SIM", # simplify
]
ignore = [
    "ANN401", # allow typing.Any where it is genuinely needed
]

[tool.ruff.lint.isort]
known-first-party = ["claimtrace_api", "tests", "evals"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["ANN"]
"tests/*" = ["ANN201"]
