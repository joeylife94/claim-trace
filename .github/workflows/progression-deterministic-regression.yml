name: Progression Deterministic Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "Makefile"
      - "apps/api/evals/**"
      - "apps/api/tests/**"
      - "apps/api/claimtrace_api/**"
      - ".env.example"
      - "docker-compose.yml"
      - ".github/workflows/progression-deterministic-regression.yml"

permissions:
  contents: read

jobs:
  deterministic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Allow container to write evaluation results
        run: chmod -R a+rwX apps/api/evals/results

      - name: Run one-command deterministic regression verification
        run: make verify-deterministic-regression

      - name: Show retrieval report
        if: always()
        run: cat apps/api/evals/results/REPORT.md || true

      - name: Show deterministic grounded report
        if: always()
        run: cat apps/api/evals/results/grounded/REPORT-deterministic.md || true

      - name: Upload deterministic regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progression-deterministic-regression-${{ github.event.pull_request.head.sha }}
          path: |
            apps/api/evals/results/results.json
            apps/api/evals/results/REPORT.md
            apps/api/evals/results/grounded/results-deterministic.json
            apps/api/evals/results/grounded/REPORT-deterministic.md
          if-no-files-found: error
          retention-days: 14

      - name: Capture PostgreSQL diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color postgres || true

      - name: Tear down evaluation runtime
        if: always()
        run: docker compose down -v --remove-orphans || true
