name: Progression Retry UI Verification

on:
  pull_request:
    paths:
      - "apps/web/app/documents/**"
      - "apps/web/components/RetryDocumentForm.tsx"
      - "apps/web/lib/action-state.ts"
      - "apps/web/lib/documents.ts"
      - "apps/web/e2e/progression-retry-ui.mjs"
      - ".github/workflows/progression-retry-ui.yml"

permissions:
  contents: read

jobs:
  retry-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies and browser
        working-directory: apps/web
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify failed-ingestion retry UI
        working-directory: apps/web
        run: node e2e/progression-retry-ui.mjs
