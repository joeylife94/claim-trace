[project]
name = "claimtrace-api"
version = "0.1.0"
description = "ClaimTrace API - evidence-grounded patent claim analysis backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "pymupdf>=1.24",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimtrace_api"]

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." lets test modules share helpers via `from tests.pdf_factory import ...`.
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "integration: requires a reachable PostgreSQL instance (skipped when absent)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "C4",  # comprehensions
    "SIM", # simplify
]
ignore = [
    "ANN401", # allow typing.Any where it is genuinely needed
]

[tool.ruff.lint.isort]
known-first-party = ["claimtrace_api", "tests"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["ANN"]
"tests/*" = ["ANN201"]
