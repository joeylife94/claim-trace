**Resulting main merge SHA:** `8bcff96fd64461f3f46a2c9a388009fbbf7b7325`

#### Changed

- added persistent analyst `Case` identity with minimal human-readable metadata;
- added persisted Case-to-existing-document association without copying source text or creating a second evidence coordinate system;
- added bounded create/list/read/reopen API behavior plus explicit duplicate/missing/disassociation handling;
