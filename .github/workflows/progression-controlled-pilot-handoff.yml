name: Progression Controlled Pilot Handoff

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/verify-controlled-pilot-handoff.sh"
      - "scripts/verify-progression-retry-real.sh"
      - "scripts/verify-v1-06-clean-start.sh"
      - "scripts/verify-v1-06-golden-path.sh"
      - "docs/CONTROLLED_PILOT_HANDOFF.md"
      - "docs/proof/**"
      - "apps/api/**"
      - "apps/web/**"
      - "docker-compose.yml"
      - ".env.example"
      - "infra/postgres/init/**"
      - ".github/workflows/progression-controlled-pilot-handoff.yml"

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Execute delivery-ready controlled pilot handoff
        run: sh scripts/verify-controlled-pilot-handoff.sh

      - name: Verify bounded handoff report language
        run: |
          test -s build/controlled-pilot-handoff/README.md
          test -s build/controlled-pilot-handoff/proof-assets.sha256
          test -s build/controlled-pilot-handoff/handoff-report.sha256
          grep -F 'not semantic entailment or legal correctness' build/controlled-pilot-handoff/README.md
          grep -F 'does not determine infringement, validity, novelty, equivalence, inventive step, patentability' build/controlled-pilot-handoff/README.md

      - name: Upload handoff evidence
        uses: actions/upload-artifact@v4
        with:
          name: controlled-pilot-handoff-${{ github.event.pull_request.head.sha }}
          path: build/controlled-pilot-handoff/
          if-no-files-found: error
          retention-days: 14

      - name: Capture diagnostics on failure
        if: failure()
        run: |
          docker compose -p claimtrace-handoff-clean-start ps || true
          docker compose -p claimtrace-handoff-retry ps || true
          docker compose -p claimtrace-handoff-golden-path ps || true

      - name: Tear down handoff runtimes
        if: always()
        run: |
          docker compose -p claimtrace-handoff-clean-start down -v --remove-orphans || true
          docker compose -p claimtrace-handoff-retry down -v --remove-orphans || true
          docker compose -p claimtrace-handoff-golden-path down -v --remove-orphans || true
