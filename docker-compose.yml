# ClaimTrace local development environment.
#
#   cp .env.example .env
#   docker compose up --build
#
# Ports (host -> container):
#   web       3000 -> 3000   Next.js dev server
#   api       8000 -> 8000   FastAPI (docs at http://localhost:8000/docs)
#   postgres  5432 -> 5432   PostgreSQL 17 + pgvector
#
# Every value comes from .env; nothing secret is committed.

name: claimtrace

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Keeps initdb deterministic across host locales.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once on an empty data directory; migrations remain the source of truth.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-ClaimTrace API}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      # Inside the compose network PostgreSQL is reachable by service name.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Document ingestion
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/uploads}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-20971520}
      MIN_EXTRACTED_CHARACTERS: ${MIN_EXTRACTED_CHARACTERS:-32}
      # Claim indexing and retrieval
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence-transformers}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_CACHE_DIR: ${EMBEDDING_CACHE_DIR:-/models}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      DENSE_CANDIDATE_COUNT: ${DENSE_CANDIDATE_COUNT:-30}
      LEXICAL_CANDIDATE_COUNT: ${LEXICAL_CANDIDATE_COUNT:-30}
      RRF_K: ${RRF_K:-60}
      SEARCH_TOP_K_MAX: ${SEARCH_TOP_K_MAX:-50}
      SEARCH_QUERY_MAX_LENGTH: ${SEARCH_QUERY_MAX_LENGTH:-512}
      # Local LLM provider. "fake" by default, so this stack starts and every
      # endpoint works with no model server running and nothing downloaded.
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_OLLAMA_BASE_URL: ${LLM_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM_OLLAMA_MODEL: ${LLM_OLLAMA_MODEL:-qwen2.5:1.5b}
      LLM_OPENAI_COMPATIBLE_BASE_URL: ${LLM_OPENAI_COMPATIBLE_BASE_URL:-http://localhost:8000/v1}
      LLM_OPENAI_COMPATIBLE_MODEL: ${LLM_OPENAI_COMPATIBLE_MODEL:-local-model}
      LLM_OPENAI_COMPATIBLE_API_KEY: ${LLM_OPENAI_COMPATIBLE_API_KEY:-}
      LLM_STRUCTURED_OUTPUT_MODE: ${LLM_STRUCTURED_OUTPUT_MODE:-native_json_schema}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-5}
      LLM_READ_TIMEOUT_SECONDS: ${LLM_READ_TIMEOUT_SECONDS:-120}
      LLM_MAX_TIMEOUT_SECONDS: ${LLM_MAX_TIMEOUT_SECONDS:-180}
      LLM_RETRY_MAX_ATTEMPTS: ${LLM_RETRY_MAX_ATTEMPTS:-2}
      LLM_MAX_PROMPT_CHARACTERS: ${LLM_MAX_PROMPT_CHARACTERS:-8000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}
      LLM_DIAGNOSTICS_ENABLED: ${LLM_DIAGNOSTICS_ENABLED:-}
      # Evidence-grounded generation. Works with LLM_PROVIDER=fake: the fake
      # provider satisfies the grounded output schema, so the endpoint and the
      # /grounded page are exercisable with no model server present.
      GROUNDED_GENERATION_ENABLED: ${GROUNDED_GENERATION_ENABLED:-true}
      GROUNDED_MAX_EVIDENCE_CANDIDATES: ${GROUNDED_MAX_EVIDENCE_CANDIDATES:-6}
      GROUNDED_MAX_EVIDENCE_CHARACTERS: ${GROUNDED_MAX_EVIDENCE_CHARACTERS:-5000}
      GROUNDED_MAX_QUESTION_CHARACTERS: ${GROUNDED_MAX_QUESTION_CHARACTERS:-512}
      GROUNDED_MAX_STATEMENTS: ${GROUNDED_MAX_STATEMENTS:-8}
      GROUNDED_MAX_STATEMENT_CHARACTERS: ${GROUNDED_MAX_STATEMENT_CHARACTERS:-600}
      GROUNDED_MAX_EVIDENCE_IDS_PER_STATEMENT: ${GROUNDED_MAX_EVIDENCE_IDS_PER_STATEMENT:-4}
      GROUNDED_TEMPERATURE: ${GROUNDED_TEMPERATURE:-0.0}
      GROUNDED_MAX_OUTPUT_TOKENS: ${GROUNDED_MAX_OUTPUT_TOKENS:-1024}
      GROUNDED_TIMEOUT_SECONDS: ${GROUNDED_TIMEOUT_SECONDS:-150}
      GROUNDED_REPAIR_MAX_ATTEMPTS: ${GROUNDED_REPAIR_MAX_ATTEMPTS:-1}
    # Lets the API reach an Ollama running on the host at
    # host.docker.internal. Docker Desktop provides the name already; this line
    # is what makes the same configuration work on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Hot reload during development; the image remains self-contained.
      - ./apps/api/src:/app/src:ro
      - ./apps/api/alembic:/app/alembic:ro
      - ./apps/api/tests:/app/tests:ro
      # Writable, unlike the other source mounts: `python -m evals.run` writes
      # results.json and REPORT.md back into the repository, which is where they
      # are reviewed and committed from.
      - ./apps/api/evals:/app/evals
      # Uploaded originals live in a volume, never in the source tree.
      - document_storage:/data/uploads
      # Embedding model weights. A volume, so they are downloaded once and are
      # never baked into the image or written into the Git tree.
      - model_cache:/models
    command:
      - uvicorn
      - claimtrace_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      # Server-side fetches stay on the compose network.
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://api:8000}
      # Fallback, and the value any future browser-side call would use.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      # Source is mounted for hot reload; node_modules stays inside the image.
      - ./apps/web/app:/app/app
      - ./apps/web/components:/app/components
      - ./apps/web/lib:/app/lib
      - ./apps/web/public:/app/public
    depends_on:
      api:
        condition: service_healthy

  # Optional. Not started by `docker compose up`, because the rest of the stack
  # does not depend on it and a model server is a large thing to require of
  # someone who only wants to ingest a PDF.
  #
  #   docker compose --profile llm up -d ollama
  #   docker compose exec ollama ollama pull qwen2.5:1.5b
  #   # then set LLM_PROVIDER=ollama and LLM_OLLAMA_BASE_URL=http://ollama:11434
  #
  # The documented default instead points the API at an Ollama running on the
  # *host* (host.docker.internal), which reuses models already pulled there
  # rather than downloading a second copy into this volume.
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      # Weights live in a named volume: they are never committed, never baked
      # into an image, and survive `docker compose down`.
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  document_storage:
  model_cache:
  ollama_models:
