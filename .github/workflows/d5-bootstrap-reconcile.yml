name: D5 Bootstrap Reconcile

on:
  push:
    branches:
      - d5-persistent-case-workspace

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d5-persistent-case-workspace
          fetch-depth: 0
      - name: Reconcile authoritative progression state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("CLAIMTRACE_V1_MASTER.md")
          text = path.read_text(encoding="utf-8")
          old = "**Post-v1 progression state:** **ENABLED — D4 selected/current / D4-01 active**"
          new = "**Post-v1 progression state:** **ENABLED — D5 selected/current / D5-01 active**"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one D4 active authority line, found {text.count(old)}")
          marker = "### Destination D4 — Description-aware Evidence Retrieval Pilot"
          if marker in text:
              raise SystemExit("D4 destination checkpoint already exists; refusing duplicate append")
          text = text.replace(old, new, 1)
          checkpoint = r'''

### Destination D4 — Description-aware Evidence Retrieval Pilot

**Status:** `DESTINATION REACHED — DESCRIPTION-AWARE EVIDENCE RETRIEVAL PILOT`  
**Accepted milestone:** D4-01 — `Description structure + retrieval`  
**Issue:** #63  
**PR:** #64  
**Accepted PR exact head:** `b786e99ade458b784f68987b7dfed69932be80b6`  
**Resulting main merge SHA:** `a6d8b4447bf251a5f0bb08465e9288f169c05622`

#### Destination Review

- real-public Korean patent execution proved persisted description segmentation, exact page/span source resolution, bounded hybrid description retrieval, and reviewer navigation to the exact persisted source range;
- applicable claim-only and D1/D2/D3 regression/proof gates remained GREEN on the accepted exact head;
- unsupported/ambiguous structure remains explicit and no legal, benchmark-quality, OCR, private-corpus, auth/RBAC, multi-tenant, cloud/Kubernetes, security-certification, or production-readiness claim was added;
- no executed destination-level blocker demonstrated a need for D4-02 mixed claim+description grounded analysis;
- no executed evidence demonstrated top-k ordering/precision as a blocker, so reranking was not selected;
- D4 is therefore closed at the smallest coherent description-aware evidence retrieval pilot boundary.

#### Exact Next Action

`D5 selected/current — D5-01 active`

D5-01 is the bounded persistent analyst Case identity + document association milestone recorded in Issue #66. Persisted grounded-analysis snapshots, Case-linked comparison/decomposition/review artifacts, export/handoff, chat/history, auth/RBAC, and customer/private corpus work remain outside D5-01 unless a later executable Destination Review demonstrates a concrete blocker.
'''
          path.write_text(text.rstrip() + checkpoint + "\n", encoding="utf-8")
          PY
          git diff --check
          git diff -- CLAIMTRACE_V1_MASTER.md
      - name: Commit reconciliation and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/d5-bootstrap-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLAIMTRACE_V1_MASTER.md .github/workflows/d5-bootstrap-reconcile.yml
          git commit -m "docs: close D4 and select D5-01"
          git push origin HEAD:d5-persistent-case-workspace
