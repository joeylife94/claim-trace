name: V1-07 Proof Package

on:
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "docs/proof/**"
      - "scripts/capture-v1-07-proof.sh"
      - "apps/web/e2e/v1-07-proof-capture.mjs"
      - ".github/workflows/v1-07-proof-package.yml"
      - "apps/api/**"
      - "apps/web/**"
      - "docker-compose.yml"
      - ".env.example"
      - "Makefile"
      - "infra/postgres/init/**"

permissions:
  contents: write

jobs:
  proof-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Korean proof font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match :lang=ko

      - name: Install browser runner
        working-directory: apps/web
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Capture deterministic proof package
        run: V1_07_PROOF_DIR="${RUNNER_TEMP}/claimtrace-v1-07-proof" sh scripts/capture-v1-07-proof.sh

      - name: Verify captured proof inventory
        run: |
          CAPTURE_DIR="${RUNNER_TEMP}/claimtrace-v1-07-proof"
          test -s docs/proof/architecture-v1.svg
          test "$(find "${CAPTURE_DIR}/screenshots" -type f -name '*.png' | wc -l)" -ge 4
          test -s "${CAPTURE_DIR}/demo/claimtrace-golden-path.webm"

      - name: Commit first executed proof capture to PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if test -s docs/proof/screenshots/01-documents.png \
            && test -s docs/proof/demo/claimtrace-golden-path.webm; then
            echo "Executed proof assets are already committed; leaving branch untouched."
            exit 0
          fi

          CAPTURE_DIR="${RUNNER_TEMP}/claimtrace-v1-07-proof"
          mkdir -p docs/proof/screenshots docs/proof/demo
          cp "${CAPTURE_DIR}"/screenshots/*.png docs/proof/screenshots/
          cp "${CAPTURE_DIR}"/demo/claimtrace-golden-path.webm docs/proof/demo/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/proof/screenshots docs/proof/demo
          git diff --cached --quiet && exit 0
          git commit -m "proof(v1-07): commit executed capture assets"
          git push origin "HEAD:${HEAD_REF}"

      - name: Verify committed proof inventory
        run: |
          test -s docs/proof/architecture-v1.svg
          test "$(find docs/proof/screenshots -type f -name '*.png' | wc -l)" -ge 4
          test -s docs/proof/demo/claimtrace-golden-path.webm

      - name: Upload current executed proof package
        uses: actions/upload-artifact@v4
        with:
          name: v1-07-proof-package-${{ github.event.pull_request.head.sha }}
          path: |
            docs/proof/architecture-v1.svg
            ${{ runner.temp }}/claimtrace-v1-07-proof/screenshots/*.png
            ${{ runner.temp }}/claimtrace-v1-07-proof/demo/claimtrace-golden-path.webm
          if-no-files-found: error
          retention-days: 14

      - name: Capture diagnostics on failure
        if: failure()
        run: |
          docker compose -p claimtrace-v1-07-proof ps || true
          docker compose -p claimtrace-v1-07-proof logs --no-color postgres api web || true

      - name: Tear down proof runtime
        if: always()
        run: docker compose -p claimtrace-v1-07-proof down -v --remove-orphans || true
